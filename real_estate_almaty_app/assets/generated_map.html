// ========================================================
// Слои
// ========================================================
var canvasRenderer = L.canvas({ padding: 0.5 });
var markersGroup = L.layerGroup().addTo(map);
var clusterGroup = null;
var heatLayer = null;
var selectedCircle = null;

// Параметры маркеров
var MARKER_RADIUS = 5;
var MARKER_OPTIONS = {
  renderer: canvasRenderer,
  weight: 0.5,
  opacity: 0.9,
  fillOpacity: 0.8,
};

// ========================================================
// Qt WebChannel (связь с Python)
// ========================================================
var bridge = null;
new QWebChannel(qt.webChannelTransport, function(channel) {
  bridge = channel.objects.bridge;
});

function notifyPython(propId) {
  if (bridge) {
    bridge.onMarkerClicked(propId);
  }
}

// ========================================================
// Рендеринг маркеров (Canvas для 9000+ точек)
// ========================================================
var currentMarkers = [];
var showSuspicious = false;
var showClusters = false;
var showHeatmap = false;

function renderMarkers(props) {
  // Очищаем предыдущие слои
  markersGroup.clearLayers();
  if (clusterGroup) { map.removeLayer(clusterGroup); clusterGroup = null; }
  if (heatLayer) { map.removeLayer(heatLayer); heatLayer = null; }
  currentMarkers = [];

  updateStatus('Отображение ' + props.length + ' объектов...');

  if (showHeatmap) {
    renderHeatmap(props);
    return;
  }

  if (showClusters) {
    renderClusters(props);
    return;
  }

  // Canvas-маркеры (быстро для 9000+ точек)
  props.forEach(function(p) {
    if (!showSuspicious && p.suspicious) return;

    var circle = L.circleMarker([p.lat, p.lon], Object.assign({}, MARKER_OPTIONS, {
      radius: MARKER_RADIUS,
      color: p.color,
      fillColor: p.color,
    }));

    circle.on('click', function() {
      highlightMarker(circle, p);
      notifyPython(p.id);
    });

    circle.bindTooltip(
      '<b>' + formatPriceShort(p.price_raw) + '</b><br>' +
      formatPriceM2Short(p.ppm2_raw) + '<br>' +
      p.rooms + '-комн., ' + p.square + ' м²',
      { sticky: true, className: 'map-tooltip' }
    );

    markersGroup.addLayer(circle);
    currentMarkers.push({ circle: circle, prop: p });
  });

  updateStatus('Показано: ' + props.length + ' объектов');
}

function renderClusters(props) {
  clusterGroup = L.markerClusterGroup({
    chunkedLoading: true,
    maxClusterRadius: 60,
  });

  props.forEach(function(p) {
    if (!showSuspicious && p.suspicious) return;

    var icon = L.divIcon({
      html: '<div style="background:' + p.color + ';width:10px;height:10px;border-radius:50%;border:1px solid rgba(0,0,0,0.3);"></div>',
      className: '',
      iconSize: [10, 10],
      iconAnchor: [5, 5],
    });

    var marker = L.marker([p.lat, p.lon], { icon: icon });
    marker.on('click', function() { notifyPython(p.id); });
    clusterGroup.addLayer(marker);
  });

  map.addLayer(clusterGroup);
  updateStatus('Кластеры: ' + props.length + ' объектов');
}

function renderHeatmap(props) {
  var points = props
    .filter(function(p) { return !p.suspicious || showSuspicious; })
    .map(function(p) { return [p.lat, p.lon, p.ppm2_raw ? Math.min(p.ppm2_raw / 1000000, 1) : 0.3]; });

  heatLayer = L.heatLayer(points, {
    radius: 20,
    blur: 15,
    maxZoom: 17,
    gradient: { 0.2: '#1e88e5', 0.4: '#43a047', 0.6: '#fdd835', 0.8: '#fb8c00', 1.0: '#e53935' },
  });
  map.addLayer(heatLayer);
  updateStatus('Тепловая карта: ' + points.length + ' объектов');
}

function highlightMarker(circle, prop) {
  // Сброс предыдущего выделения
  if (selectedCircle) {
    selectedCircle.setStyle({ weight: 0.5, radius: MARKER_RADIUS });
  }
  selectedCircle = circle;
  circle.setStyle({ weight: 3, radius: MARKER_RADIUS + 3, color: '#fff' });
  circle.bringToFront();
}

// ========================================================
// Фильтры (вызываются из Python)
// ========================================================
function applyFilters(filterJson) {
  var f = JSON.parse(filterJson);
  var filtered = allProperties.filter(function(p) {
    if (f.min_price !== null && p.price_raw < f.min_price) return false;
    if (f.max_price !== null && p.price_raw > f.max_price) return false;
    if (f.min_ppm2 !== null && p.ppm2_raw < f.min_ppm2) return false;
    if (f.max_ppm2 !== null && p.ppm2_raw > f.max_ppm2) return false;
    if (f.min_rooms !== null && p.rooms < f.min_rooms) return false;
    if (f.max_rooms !== null && p.rooms > f.max_rooms) return false;
    if (f.min_year !== null && p.year < f.min_year) return false;
    if (f.max_year !== null && p.year > f.max_year) return false;
    if (f.min_square !== null && p.square < f.min_square) return false;
    if (f.max_square !== null && p.square > f.max_square) return false;
    if (f.only_expensive && p.color !== '#e53935') return false;
    return true;
  });
  renderMarkers(filtered);
}

function setShowClusters(val) { showClusters = val; renderMarkers(getCurrentFiltered()); }
function setShowHeatmap(val) { showHeatmap = val; renderMarkers(getCurrentFiltered()); }
function setShowSuspicious(val) { showSuspicious = val; renderMarkers(getCurrentFiltered()); }

var _lastFiltered = null;
function getCurrentFiltered() { return _lastFiltered || allProperties; }

// ========================================================
// Вспомогательные форматеры
// ========================================================
function formatPriceShort(val) {
  if (!val) return '—';
  if (val >= 1000000) return (val / 1000000).toFixed(1) + ' млн ₸';
  return Math.round(val / 1000) + ' тыс ₸';
}

function formatPriceM2Short(val) {
  if (!val) return '—';
  return Math.round(val / 1000) + ' тыс ₸/м²';
}

function updateStatus(text) {
  document.getElementById('status').textContent = text;
}

// ========================================================
// Первоначальный рендеринг
// ========================================================
window.addEventListener('load', function() {
  _lastFiltered = allProperties;
  renderMarkers(allProperties);
});

// Expose to Python via bridge calls
window.applyFilters = applyFilters;
window.setShowClusters = setShowClusters;
window.setShowHeatmap = setShowHeatmap;
window.setShowSuspicious = setShowSuspicious;
</script>
